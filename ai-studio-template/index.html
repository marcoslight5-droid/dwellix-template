<!doctype html>
<html lang="en" dir="ltr" data-theme="noir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Pitch preview: keep this until the agent approves the site and it moves to his own domain. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Akram Zubair · Off-plan & Investment Advisor, Dubai</title>
    <meta name="description" content="Off-plan launches, waterfront residences and investor consultations in Dubai. Chat on WhatsApp for brochures, payment plans and viewings." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Akram Zubair · Off-plan & Investment Advisor, Dubai" />
    <meta property="og:description" content="Off-plan launches, waterfront residences and investor consultations in Dubai." />
    <meta property="og:image" content="/images/og.jpg" />
    <meta name="theme-color" content="#0b0c0e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts are design tokens too: change them here and in styles/theme.css. -->
    <!-- Loaded without blocking first paint; text shows in the fallback font for a moment. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@600&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@600&display=swap"
    />
    <link rel="preload" as="image" href="/images/portrait.jpg" fetchpriority="high" />
    <!-- Import map used by the Google AI Studio runtime; Vite bundles from node_modules locally. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.3.1",
          "react/": "https://esm.sh/react@^19.3.1/",
          "react-dom": "https://esm.sh/react-dom@^19.3.1",
          "react-dom/": "https://esm.sh/react-dom@^19.3.1/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
