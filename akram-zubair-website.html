 أخبرني بميزانيتك والغرض من العقار، وسأرسل لك قائمة مختصرة مع خطط الدفع والتكلفة الكاملة للشراء."},bio:[{en:"I help investors and end-users choose the right Dubai property at the right stage, from the first launch event to handover and beyond. My focus is off-plan launches by leading developers, ready homes, waterfront communities and Grade A commercial space.",ar:"أساعد المستثمرين والمشترين بغرض السكن على اختيار العقار المناسب في دبي في الوقت المناسب، من فعالية الإطلاق الأولى وحتى التسليم وما بعده. أركّز على المشاريع على الخارطة من كبار المطورين، والمنازل الجاهزة، والمجتمعات المطلة على الواجهة البحرية، والمساحات التجارية من الفئة الممتازة."},{en:"Every client gets straight numbers: payment plans, service charges, realistic rental yields and resale potential, so decisions are made on facts, not hype. I also look after investor relations for overseas buyers, handling viewings, paperwork and handover remotely.",ar:"يحصل كل عميل على أرقام واضحة: خطط الدفع ورسوم الخدمات والعوائد الإيجارية الواقعية وإمكانات إعادة البيع، لتُبنى القرارات على الحقائق لا على الدعاية. كما أتولّى علاقات المستثمرين من خارج الدولة، فأتابع المعاينات والأوراق والتسليم عن بُعد."}],photo:"data:image/jpeg;base64,/9j/2wBDAAQEBAQEBAQFBQQGBgYGBgkIBwcICQ0KCgoKCg0UDQ8NDQ8NFBIWEhESFhIgGRcXGSAlHx4fJS0pKS05NjlLS2T/2wBDAQQEBAQEBAQFBQQGBgYGBgkIBwcICQ0KCgoKCg0UDQ8NDQ8NFBIWEhESFhIgGRcXGSAlHx4fJS0pKS05NjlLS2T/wgARCAFAAUADASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAABgMEBQcAAggBCf/EABsBAAIDAQEBAAAAAAAAAAAAAAQFAAIDAQYH/9oADAMBAAIQAxAAAADh3MzTPMzJMzPZM2Ku0Btud+qzd+sNjOWutuYE7A0tKsbU2ynqkt+rysedocxZctX5JHyXe3oXiBxbGZipuBbBhGRkM3HKfBaUknlXxDryqOavoLIDz5N6fQzhwaDOee9mZmSZmZJmZkmZm/ea2552usJkCtsNrjyxQcfc0lOZukRgPav7VjSDmcqNEkIyFH3Gz1iKOiVrQIZVd2LVtqBWnQs3G3YlUyDjHQL5cefyhEVaXBJCTqNbYyx6XbIaThWvPofyPneqc12H0zMyTMzznM6GiuxlByRNJxSw2WF52lq8s19V0kHY5yAK8iJZgdR+1RZiSBbQWSyu5kwc2YQ6db1fblQ22BsSiBfAPgq1kFd3atNXx7KaqSOlrs/fdKZz8c2873Rg/fc04nqn6IcYKja8zz3fLJyEvsAq67KoSxPB+j6YGX0CbhvyL1ryE6AZmQNYQ200fBMt5lvfPkU8NwSgZ/R0uAHxcp3EViDdvXU
